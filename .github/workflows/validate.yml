name: Validate workflow lab
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run verify:local -- --output artifacts/validation
      - run: npm audit --audit-level=moderate
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: validation-${{ matrix.os }}
          path: artifacts/validation/
          if-no-files-found: warn
